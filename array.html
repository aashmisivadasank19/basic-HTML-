<!DOCTYPE html>
<html>
<head><title> Array in JS</title>
<script>
var emp=["Akioo", "Dabi", "Ratna", "Joy", "Anu"];
document.write("1st method to print Array <br>");
for (i=0;i<emp.length;i++){
document.write(emp[i] + "<br/>");
}

var i;
var emp = new Array();
emp[0] = "Mouse";
emp[1] = "CPU";
emp[2] = "Hard Disk";
document.write("<br> 2nd method - Associative Array <br>");
for (i=0;i<emp.length;i++){
document.write(emp[i] + "<br>");
}

var emp = new Array("Pen", "Eraser", "Pencil");
document.write("<br> 3rd method to print Array <br>");
for (i=0;i<emp.length;i++){
document.write(emp[i] + "<br/>");
}


</script>
</head>
</html>
