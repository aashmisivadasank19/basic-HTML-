<!Doctype html>
<html>
<head> <title>Student Registration Form</title></head>
<body>
	<h2>Student Registration Form</h2>
	<form action="done.html">
	<lable>Full name:</lable><br>
	<input type="text" placeholder="Enter your name"><br>

	<lable>Email:</lable><br>
	<input type="email" placeholder="Enter your email"><br>

	<lable>Password:</lable><br>
	<input type="password"><br>

	<lable>Age:</lable><br>
	<input type="number"><br>

	<lable>Date of birth</lable><br>
	<input type="date"><br>

	<lable>Gender:</lable><br>
	<input type="radio" name="gender">Male
	<input type="radio" name="gender">Female
	<input type="radio" name="gender">Other <br>

	<lable>Skill:</lable><br>
	<input type="checkbox">HTML<br>
	<input type="checkbox">CSS<br>
	<input type="checkbox">JavaScript <br>

	<lable>Course:</lable><br>
	<select>
	<option>Select Course</option>
	<option>Full stack developer</option>
	<option>Data Science</option>
	<option>Python Programming</option>
	</select> <br>

	<lable>Address:</lable><br>
	<textarea row="3" cols="20"></textarea> <br>
	
	<input type="submit" value="Register">
	<input type="reset" value="Clear">

	</form>

</body>
</html>
