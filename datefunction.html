<!doctype html>
<html>
<head><title> Date Function </title></head>
<body>

	<h2> JavaScript Date Function </h2>
	<button onclick="showDate()">Show date details</button>
	<p id="result"></p>
<script>
	function showDate() {
		let today = new Date();
		
		document.getElementById("result").innerHTML= 
		"Current Date: " + today.toLocaleDateString() + "<br>" +
		"Current Time: " + today.toLocaleTimeString() + "<br>" +
		"Year: " + today.getFullYear() + "<br>" +
		"Month: " + (today.getMonth() + 1) + "<br>" +
		"Date: " + today.getDate();
		}
</script>
</body>
</html>
